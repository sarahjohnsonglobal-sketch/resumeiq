<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - ResumeIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>if (localStorage.getItem('token')) { window.location.href = '/analyze.html'; }</script>
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="/" class="logo-link">
        <div class="logo">
          <span class="logo-icon"><span class="material-symbols-outlined">bubble_chart</span></span>
          <span class="logo-text">ResumeIQ</span>
        </div>
      </a>
      <div class="header-nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <span class="material-symbols-outlined icon-moon">dark_mode</span>
          <span class="material-symbols-outlined icon-sun">light_mode</span>
        </button>
      </div>
  </header>
  <main class="main-content">
    <div class="container">
      <div class="auth-container">
        <h1 class="auth-title">Create account</h1>
        <div id="signupError" class="auth-error"></div>
        <form id="signupForm" class="auth-form">
          <input type="text" id="username" class="auth-input" placeholder="Username" required>
          <input type="email" id="email" class="auth-input" placeholder="Email" required>
          <input type="password" id="password" class="auth-input" placeholder="Password" required minlength="6">
          <button type="submit" class="btn btn-primary auth-submit"><span>Sign Up</span></button>
        </form>
        <div class="auth-links">Already have an account? <a href="login.html">Log in</a></div>
      </div>
    </div>
  </main>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
