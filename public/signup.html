<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - ResumeIQ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    .auth-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 40px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }
    .auth-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      margin-bottom: 24px;
      text-align: center;
      color: #fff;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 20px;
      border-radius: 12px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }
    .auth-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    .auth-submit {
      margin-top: 8px;
      width: 100%;
      justify-content: center;
    }
    .auth-links {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .auth-links a:hover {
      color: var(--primary-light);
    }
    .auth-error {
      color: #ef4444;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="hero-glow-1"></div>
  <div class="hero-glow-2"></div>

  <header class="app-header">
    <div class="container header-container">
      <a href="/" class="logo-link">
        <div class="logo">
          <span class="logo-icon"><i data-lucide="file-check"></i></span>
          <span class="logo-text">Resume<span class="highlight">IQ</span></span>
        </div>
      </a>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="auth-container">
        <h1 class="auth-title">Create Account</h1>
        <div id="signupError" class="auth-error"></div>
        <form id="signupForm" class="auth-form">
          <input type="text" id="username" class="auth-input" placeholder="Username" required>
          <input type="email" id="email" class="auth-input" placeholder="Email Address" required>
          <input type="password" id="password" class="auth-input" placeholder="Password" required minlength="6">
          <button type="submit" class="btn btn-primary auth-submit">
            <span>Sign Up</span>
          </button>
        </form>
        <div class="auth-links">
          Already have an account? <a href="login.html">Log In</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
