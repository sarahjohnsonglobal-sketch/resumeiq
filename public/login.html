<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - ResumeIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>if (localStorage.getItem('token')) { window.location.href = '/analyze.html'; }</script>
  <style>
    .auth-container { max-width: 400px; margin: 100px auto; padding: 40px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .auth-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; margin-bottom: 24px; text-align: center; color: #fff; }
    .auth-form { display: flex; flex-direction: column; gap: 14px; }
    .auth-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 14px 20px; border-radius: 12px; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1rem; outline: none; transition: all 0.3s ease; }
    .auth-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }
    .auth-submit { margin-top: 4px; width: 100%; justify-content: center; }
    .auth-links { margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-muted); }
    .auth-links a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .auth-links a:hover { color: var(--primary-light); }
    .auth-error { color: #ef4444; font-size: 0.9rem; text-align: center; margin-bottom: 12px; display: none; }
    .divider-row { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
    .divider-row hr { flex: 1; border: none; border-top: 1px solid rgba(255,255,255,0.1); }
    .divider-row span { color: var(--text-muted); font-size: 0.85rem; }
    .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.95rem; transition: all 0.3s ease; }
    .google-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); }
  </style>
</head>
<body>
  <div class="hero-glow-1"></div>
  <div class="hero-glow-2"></div>
  <header class="app-header">
    <div class="container header-container">
      <a href="/" class="logo-link">
        <div class="logo">
          <span class="logo-icon"><i data-lucide="file-check"></i></span>
          <span class="logo-text">Resume<span class="highlight">IQ</span></span>
        </div>
      </a>
    </div>
  </header>
  <main class="main-content">
    <div class="container">
      <div class="auth-container">
        <h1 class="auth-title">Log in</h1>
        <div id="loginError" class="auth-error"></div>
        <form id="loginForm" class="auth-form">
          <input type="email" id="email" class="auth-input" placeholder="Email" required>
          <input type="password" id="password" class="auth-input" placeholder="Password" required>
          <button type="submit" class="btn btn-primary auth-submit"><span>Log In</span></button>
        </form>
        <div class="divider-row"><hr><span>or</span><hr></div>
        <button id="googleSignIn" class="google-btn">
          <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.54 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.77.87 7.35 2.56 10.56l7.98-5.97z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/></svg>
          <span>Continue with Google</span>
        </button>
        <div class="auth-links">Don't have an account? <a href="signup.html">Sign up</a></div>
      </div>
    </div>
  </main>
  <script src="js/auth.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
